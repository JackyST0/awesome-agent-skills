name: Sync Search Index

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'README_ZH.md'
      - 'docs/skills.json'
      - 'scripts/sync-search-index.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-search-index:
    name: Regenerate search index
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate search index
        run: npm run sync:search

      - name: Commit generated index
        run: |
          if git diff --quiet -- docs/skills.json; then
            echo "Search index already up to date."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/skills.json
          git commit -m "chore: sync search index [skip ci]"
          git push
